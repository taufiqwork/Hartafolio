<style>
/* Tata letak: panel alur di kiri, bingkai HP di kanan. Di layar sempit panel menjadi barisan chip di atas HP tanpa bingkai. */
:root {
  --bg: #eef1ec; --panel: #f7f8f5; --ink: #14201b; --muted: #5f6e67; --line: #d3dad3; --brand: #0f6b4f; --brand-soft: #e2f1ea; --on-brand: #fff; --gold: #c9952e; --bezel: #111816; --shadow: 0 30px 60px -20px rgba(20,32,27,.35), 0 8px 20px rgba(20,32,27,.12);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b100e; --panel: #121a17; --ink: #e7ede9; --muted: #92a39a; --line: #26332d; --brand: #4fbf97; --brand-soft: #16302a; --on-brand: #06231a; --bezel: #050807; --shadow: 0 30px 60px -20px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0b100e; --panel: #121a17; --ink: #e7ede9; --muted: #92a39a; --line: #26332d; --brand: #4fbf97; --brand-soft: #16302a; --on-brand: #06231a; --bezel: #050807; --shadow: 0 30px 60px -20px rgba(0,0,0,.7); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
.shell { height: 100%; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 32px 28px 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.brand b { color: var(--brand); font-weight: 700; }
.lede { display: flex; flex-direction: column; gap: 10px; }
h1 { margin: 0; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.lede p { margin: 0; font-size: 15px; line-height: 24px; color: var(--muted); max-width: 38ch; }
.tag { align-self: flex-start; font-size: 12px; line-height: 18px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
.list { display: flex; flex-direction: column; gap: 4px; }
.lh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.list h2 { margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sc { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; transition: background-color .18s ease, border-color .18s ease; }
.sc:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (hover: hover) { .sc:hover { background: var(--bg); } }
.sc[aria-current="true"] { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
.sc i { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; background: var(--bg); color: var(--muted); }
.sc[aria-current="true"] i { background: var(--brand); color: var(--on-brand); }
.sc span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sc strong { font-size: 15px; line-height: 22px; font-weight: 600; }
.sc small { font-size: 13px; line-height: 20px; color: var(--muted); }
.again { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; }
.again:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (hover: hover) { .again:hover { border-color: var(--muted); } }
.foot { margin-top: auto; font-size: 12px; line-height: 18px; color: var(--muted); }
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--brand) 9%, var(--bg)), var(--bg) 70%); }
.device { position: relative; flex: none; border-radius: calc(54px * var(--s)); background: var(--bezel); padding: calc(10px * var(--s)); box-shadow: var(--shadow); }
.screen { position: relative; width: calc(390px * var(--s)); height: calc(844px * var(--s)); border-radius: calc(44px * var(--s)); overflow: hidden; background: #f5f6f2; }
.screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform: scale(var(--s)); transform-origin: 0 0; background: #f5f6f2; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: calc(47px * var(--s)); pointer-events: none; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: calc(6px * var(--s)) calc(30px * var(--s)) 0; font-size: calc(15px * var(--s)); font-weight: 600; color: #14201b; }
.sys { display: inline-flex; align-items: center; gap: calc(6px * var(--s)); }
.bar svg { height: calc(12px * var(--s)); width: auto; }
.bar #clock { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.isl { position: absolute; left: 50%; top: calc(11px * var(--s)); width: calc(112px * var(--s)); height: calc(32px * var(--s)); transform: translateX(-50%); border-radius: 999px; background: var(--bezel); pointer-events: none; z-index: 3; }
.home { position: absolute; left: 50%; bottom: calc(8px * var(--s)); width: calc(134px * var(--s)); height: calc(5px * var(--s)); transform: translateX(-50%); border-radius: 999px; background: #14201b; opacity: .85; pointer-events: none; z-index: 3; }
.now { font-size: 13px; line-height: 20px; color: var(--muted); min-height: 20px; }
.chips { display: none; }
@media (max-width: 820px) {
  body { overflow: auto; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { display: none; }
  .chips { align-self: stretch; display: flex; gap: 8px; overflow-x: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chips button { all: unset; box-sizing: border-box; cursor: pointer; flex: none; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chips button[aria-current="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .chips button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .stage { padding: 0; gap: 0; background: var(--bg); justify-content: flex-start; }
  .device { padding: 0; border-radius: 0; box-shadow: none; background: transparent; }
  .screen { border-radius: 0; }
  .isl, .now { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><circle cx="24" cy="30" r="14" fill="#c9952e"/><circle cx="24" cy="30" r="9" fill="none" stroke="#f7ecd0" stroke-width="2.5"/><path d="M24 16V9" stroke="#0f6b4f" stroke-width="3" stroke-linecap="round"/><path d="M23.07 11.75 C22.76 4.56 28 2 34 2 C34 8 30.04 13 23.07 11.75 Z" fill="#0f6b4f"/><path d="M24.89 12.197 C25.511 6.488 21 5 16 5 C16 10 19.89 12.197 24.89 12.197 Z" fill="#0f6b4f"/></svg><span>Harta<b>folio</b></span></div>
    <div class="lede">
      <span class="tag">Prototype versi HP</span>
      <h1>Harta keluarga, tercatat rapi.</h1>
      <p>Semua tombol di layar bisa ditekan seperti di aplikasi sungguhan. Pilih alur di bawah, atau langsung coba sendiri.</p>
    </div>
    <div class="list" id="list"><div class="lh"><h2>Coba alur</h2>
    <button class="again" id="again" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ulangi</button></div></div>
    <div class="foot">Angka dan nama adalah data contoh. Tablet dan desktop menyusul.</div>
  </aside>
  <main class="stage">
    <div class="chips" id="chips" role="tablist" aria-label="Alur"></div>
    <div class="device" id="device"><div class="screen">
      <div class="bar" aria-hidden="true"><span id="clock">9:41</span><span class="sys"><svg viewBox="0 0 18 12" fill="#14201b"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 17 12" fill="none" stroke="#14201b" stroke-width="1.7" stroke-linecap="round"><path d="M1.2 4.1a10.2 10.2 0 0 1 14.600 0"/><path d="M3.700 6.700a6.600 6.600 0 0 1 9.600 0"/><path d="M6.200 9.200a3.100 3.100 0 0 1 4.600 0"/><circle cx="8.500" cy="11.100" r=".5" fill="#14201b"/></svg><svg viewBox="0 0 27 12" fill="#14201b"><rect x=".5" y=".5" width="22" height="11" rx="3.200" fill="none" stroke="#14201b" stroke-opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2"/><path d="M24 4.200v3.600c.8-.3 1.500-1.100 1.500-1.800S24.800 4.500 24 4.200Z" fill-opacity=".45"/></svg></span></div>
      <div class="isl" aria-hidden="true"></div>
      <iframe id="app" title="Prototype Hartafolio" src="00-Splash.dc.html"></iframe>
      <div class="home" aria-hidden="true"></div>
    </div></div>
    <div class="now" id="now" aria-live="polite"></div>
  </main>
</div>
<script>
var SC = [
  { id: 'awal', t: 'Mulai dari awal', d: 'Layar pembuka, lalu siapkan anggota, lokasi, dan import data.', src: '00-Splash.dc.html' },
  { id: 'beranda', t: 'Beranda keluarga', d: 'Total harta, per anggota, per aset, pengingat zakat dan piutang.', src: 'Main.dc.html' },
  { id: 'catat', t: 'Catat transaksi', d: 'Beli, jual, masuk, keluar, dan pindah dalam satu form.', src: '04-Catat.dc.html' },
  { id: 'aset', t: 'Aset dan harga', d: 'Posisi per jenis aset, filter lokasi, lalu kelola harga.', src: '03-Aset.dc.html' },
  { id: 'riwayat', t: 'Riwayat transaksi', d: 'Cari, filter, lihat detail, ubah, hapus, dan pulihkan.', src: '05-Riwayat.dc.html' },
  { id: 'laporan', t: 'Laporan dan export', d: 'Nilai bulanan, per anggota, lalu unduh PDF atau Excel.', src: '07-Laporan.dc.html' },
  { id: 'zakat', t: 'Zakat mal', d: 'Nishob, haul, dan catat pembayaran.', src: '08-Zakat.dc.html' },
  { id: 'piutang', t: 'Piutang', d: 'Pinjamkan aset, terima cicilan, ubah rencana, dan pelunasan.', src: '18-Piutang.dc.html' },
  { id: 'import', t: 'Import dari Excel', d: 'Unduh template, isi, periksa, lalu simpan. Bisa diurungkan.', src: '10-Import.dc.html' },
  { id: 'alat', t: 'Menu Alat', d: 'Anggota, lokasi, aset, Google Sheet, dan pengaturan.', src: '09-Lainnya.dc.html' }
];
var app = document.getElementById('app'), list = document.getElementById('list'), chips = document.getElementById('chips'), dev = document.getElementById('device'), now = document.getElementById('now');
var cur = SC[1];
function mark(push) {
  document.querySelectorAll('[data-sc]').forEach(function (b) {
    var on = b.getAttribute('data-sc') === cur.id;
    b.setAttribute('aria-current', String(on));
    if (on && b.parentNode === chips) chips.scrollTo({ left: b.offsetLeft - (chips.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
  });
  if (push) { try { history.replaceState(null, '', '#' + cur.id); } catch (e) {} }
}
function pick(s, push) { cur = s; app.src = s.src; mark(push); }
SC.forEach(function (s, i) {
  var b = document.createElement('button'); b.className = 'sc'; b.type = 'button'; b.setAttribute('data-sc', s.id);
  b.innerHTML = '<i>' + (i + 1) + '</i><span><strong>' + s.t + '</strong><small>' + s.d + '</small></span>';
  b.onclick = function () { pick(s, true); }; list.appendChild(b);
  var c = document.createElement('button'); c.type = 'button'; c.setAttribute('data-sc', s.id); c.textContent = s.t; c.onclick = function () { pick(s, true); }; chips.appendChild(c);
});
document.getElementById('again').onclick = function () { app.src = cur.src; };
var splashTimer = null;
function which(f) {
  if (/^(00|01)-/.test(f)) return 'awal';
  if (/^Main/.test(f)) return 'beranda';
  if (/^04-/.test(f)) return 'catat';
  if (/^05-/.test(f)) return 'riwayat';
  if (/^07-/.test(f)) return 'laporan';
  if (/^(08|16)-/.test(f) || /11-Harga-2e/.test(f)) return 'zakat';
  if (/^10-/.test(f)) return 'import';
  if (/^18-/.test(f)) return 'piutang';
  if (/11-Harga-2d|14-Aset-2i/.test(f)) return 'beranda';
  if (/^03-/.test(f) || (/^14-/.test(f) && !/Dari-Lainnya/.test(f))) return 'aset';
  return 'alat';
}
function onScreen(file, title) {
  now.textContent = title ? 'Layar: ' + title : '';
  var id = which(file);
  if (id !== cur.id) { cur = SC.filter(function (x) { return x.id === id; })[0] || cur; mark(true); }
  clearTimeout(splashTimer);
  if (file === '00-Splash.dc.html') splashTimer = setTimeout(function () { app.src = '01-Setup-1-Akun.dc.html'; }, 2200);
}
window.addEventListener('message', function (e) {
  if (e.source !== app.contentWindow || !e.data || !e.data.hfScreen) return;
  onScreen(e.data.hfScreen, e.data.title);
});
function fit() {
  var narrow = window.innerWidth <= 820, W = window.innerWidth, H = window.innerHeight, s;
  if (narrow) { var chipsH = chips.offsetHeight || 0; s = Math.min(W / 390, (H - chipsH) / 844); }
  else { var side = document.querySelector('.side').offsetWidth; s = Math.min(1.15, (W - side - 48) / 410, (H - 24 - 48 - 20) / 864); }
  document.documentElement.style.setProperty('--s', Math.max(.35, s).toFixed(4));
}
window.addEventListener('resize', fit);
function tick() { var d = new Date(); document.getElementById('clock').textContent = d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
tick(); setInterval(tick, 15000);
var h = (location.hash || '').slice(1), st = SC.filter(function (x) { return x.id === h; })[0] || SC[1];
fit(); pick(st, false);
</script>
