<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/hartafolio/tokens.css">
<link rel="stylesheet" href="ds/hartafolio/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--brand)}
.wx{position:relative;overflow:hidden;background:var(--surface);color:var(--ink);font-family:var(--font-sans);box-sizing:border-box;display:grid}
.wx *{box-sizing:border-box}
.wd{grid-template-columns:248px minmax(0,1fr)}
.wt{grid-template-columns:88px minmax(0,1fr)}
.wd-side{display:flex;flex-direction:column;gap:16px;padding:24px 16px 16px;background:var(--surface-raised);border-right:1px solid var(--line);min-height:0}
.wd-logo{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em}
.wd-logo b{color:var(--brand);font-weight:700}
.wd-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.wd-nav-a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:var(--radius-md);font-size:14px;line-height:20px;font-weight:500;color:var(--ink-muted);text-decoration:none;transition:background-color .18s ease,color .18s ease}
.wd-nav-a:hover{background:var(--surface-sunken);color:var(--ink)}
.wd-nav-a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.wd-nav-a[aria-current="page"] .hf-ico-fill{fill:var(--brand-soft)}
.wd-nav-a svg{flex:none}
.wd-sec{padding:16px 12px 4px;font-size:12px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.wd-acct{display:flex;align-items:center;gap:12px;padding:12px 8px 0;border-top:1px solid var(--line)}
.wd-av{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:14px}
.wt-rail{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 8px;background:var(--surface-raised);border-right:1px solid var(--line)}
.wt-rail-a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:var(--radius-md);font-size:11px;line-height:16px;font-weight:500;color:var(--ink-muted);text-decoration:none}
.wt-rail-a svg{width:44px;height:28px;padding:2px 10px;border-radius:999px;box-sizing:border-box;transition:background-color .18s ease}
.wt-rail-a[aria-current="page"]{color:var(--brand);font-weight:600}
.wt-rail-a[aria-current="page"] svg{background:var(--brand-soft)}
.wt-rail-a[aria-current="page"] .hf-ico-fill{fill:var(--brand-soft)}
.wt-add{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--on-brand);background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 78%,#fff) 0%,var(--brand) 70%);box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent);margin-bottom:8px}
.wx-main{overflow:auto;min-height:0;scrollbar-width:none}
.wd .wx-main{padding:32px 40px 40px}
.wt .wx-main{padding:24px 24px 32px}
.wx-in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wt .wx-in{gap:16px}
.wx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.wx-head-act{display:flex;align-items:center;gap:8px;flex:none}
.wx-sub{margin:0;font-size:15px;line-height:24px;color:var(--ink-muted);max-width:640px}
.wx-back{display:inline-flex;align-items:center;gap:2px;font-size:13px;line-height:20px;font-weight:600;text-decoration:none}
.wx-g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.wt .wx-g{gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.wx-chips{display:flex;flex-wrap:wrap;gap:8px}
.wx-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.wx-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;line-height:20px;font-weight:500;color:var(--ink-muted)}
.wx-help{font-size:12px;line-height:18px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.wx-row{display:grid;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.wx-row:first-child{border-top:0}
.wx-th{display:grid;align-items:center;gap:16px;padding:0 0 8px;font-size:12px;line-height:18px;font-weight:500;color:var(--ink-muted);border-bottom:1px solid var(--line)}
.wx-th + .wx-row{border-top:0}
.wx-name{font-size:15px;line-height:22px;font-weight:600}
.wx-meta{font-size:12px;line-height:18px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-num{font-size:15px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wx-r{text-align:right;justify-self:end}
.wx-tr{transition:background-color .18s ease}
.wx-tr:hover{background:color-mix(in srgb,var(--surface-sunken) 60%,transparent)}
.wx-hero{background:linear-gradient(155deg,color-mix(in srgb,var(--brand-soft) 85%,var(--surface-raised)),var(--surface-raised) 62%)}
.wx-donut .wx-dc-l{font-size:13px;line-height:18px;color:var(--ink);font-weight:600}
.wx-donut .wx-dc-c{font-size:12px;line-height:16px;color:var(--ink-muted);font-weight:500}
.wx-donut .wx-dc-v{font-size:20px;line-height:28px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.wx-donut .wx-share{justify-self:center;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.wx-donut circle{fill:none;stroke-linecap:round}
.wx-donut svg{animation:wxSweep 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes wxSweep{from{opacity:0;transform:rotate(-150deg)}}
.wx-line{stroke-dasharray:100;animation:wxDraw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes wxDraw{from{stroke-dashoffset:100}}
.wx-area-fill{animation:wxFade .9s .3s ease both}
@keyframes wxFade{from{opacity:0}}
.wx-rise{animation:wxRise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes wxRise{from{opacity:0;transform:translateY(8px)}}
.wx-bars{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px}
.wx-zero{position:absolute;left:0;right:0;height:1px;background:var(--line-strong)}
.wx-barcol{all:unset;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:opacity .2s ease}
.wx-bar-up{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;width:100%}
.wx-bar-dn{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:4px;width:100%}
.wx-bar-v{font-size:11px;line-height:16px;font-variant-numeric:tabular-nums}
.wx-bar-m{font-size:12px;line-height:18px;margin-top:6px}
.hf-bar{display:block;width:min(44px,70%);border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 62%,var(--surface-raised)),var(--brand));transform-origin:bottom;animation:wxGrow .7s cubic-bezier(.2,.8,.2,1) both}
.hf-bar-neg{border-radius:4px 4px 8px 8px;background:linear-gradient(0deg,color-mix(in srgb,var(--loss) 55%,var(--surface-raised)),color-mix(in srgb,var(--loss) 80%,var(--surface-raised)));transform-origin:top}
@keyframes wxGrow{from{transform:scaleY(0)}}
.wx-live{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--brand);box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 40%,transparent);animation:wxPulse 2s infinite}
@keyframes wxPulse{70%{box-shadow:0 0 0 6px transparent}}
.wx-dialog{position:absolute;inset:0;margin:auto;height:fit-content;max-height:86%;z-index:21;display:flex;flex-direction:column;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-menu);overflow:hidden}
.wx-dialog-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 12px}
.wx-dialog-b{overflow:auto;padding:4px 24px 24px;display:flex;flex-direction:column;gap:20px}
.wx-dialog-f{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface-raised)}
.wx-x{width:40px;height:40px;border-radius:999px;border:0;display:grid;place-items:center;background:var(--surface-sunken);color:var(--ink);cursor:pointer}
.wx-panel{position:absolute;top:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;background:var(--surface-raised);border-left:1px solid var(--line);box-shadow:var(--shadow-menu)}
.wx-pop{position:absolute;z-index:22;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-menu);padding:16px;display:flex;flex-direction:column;gap:12px}
.wx-cal{display:grid;grid-template-columns:repeat(7,40px);gap:2px;justify-content:space-between}
.wx-cal span{height:36px;display:grid;place-items:center;border-radius:10px;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums}
.wx-pill-l{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12px;line-height:18px;font-weight:600}
.wx-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 24px}
.wx-kv{display:flex;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;padding:8px 0}
.wx-kv span:first-child{color:var(--ink-muted)}
.wx-kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
@media (prefers-reduced-motion: reduce){.wx *{animation:none!important}}
</style>
</helmet>
<div data-theme="{{ theme }}" class="wx" style="width: 1440px; height: 900px; grid-template-columns: minmax(0, 1fr);"><main class="wx-main" style="display: grid; place-items: center; padding: 0;"><div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;"><svg viewBox="0 0 48 48" width="112" height="112" aria-hidden="true"><circle cx="24" cy="30" r="14" fill="var(--gold-fill)"></circle><circle cx="24" cy="30" r="9" fill="none" stroke="var(--gold-soft)" stroke-width="2.5"></circle><path d="M24 16V9" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"></path><path d="M23.07 11.75 C22.76 4.56 28 2 34 2 C34 8 30.04 13 23.07 11.75 Z" fill="var(--brand)"></path><path d="M24.89 12.197 C25.511 6.488 21 5 16 5 C16 10 19.89 12.197 24.89 12.197 Z" fill="var(--brand)"></path></svg><div style="display: flex; flex-direction: column; align-items: center; gap: 8px;"><h1 class="title" style="margin: 0; font-size: 28px; line-height: 36px;">Hartafolio</h1><p class="wx-sub" style="margin: 0;">Harta keluarga, tercatat rapi.</p></div><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 24px;"><div class="hf-track" style="width: 120px;" aria-hidden="true"><span style="width: 100%; background: var(--brand);"></span></div><span class="caption" style="color: var(--ink-muted);">Menyiapkan data Anda</span></div></div></main></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1307}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
