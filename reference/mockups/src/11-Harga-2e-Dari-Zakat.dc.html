<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Harga · dibuka dari Zakat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/hartafolio/tokens.css">
<link rel="stylesheet" href="ds/hartafolio/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--brand)}.pr+.pr{border-top:1px solid var(--line)}[role=group]::-webkit-scrollbar{display:none}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{ theme }}" style="width: 390px; height: 844px; position: relative; --safe-top: 47px; --safe-bottom: 34px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
<div class="hf-head"><a href="08-Zakat.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none; line-height: 22px;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Zakat mal</a><h1 class="title" style="margin: 0;">Harga terkini</h1><div style="display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 6px;" role="group" aria-label="Kelompok harga">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5"><button class="hf-chip" type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.on }}" style="flex: none;">{{ c.l }}</button></sc-for>
</div></div>
<main class="hf-scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px calc(var(--safe-bottom) + 24px); display: flex; flex-direction: column; gap: 16px;">

<div style="display: flex; flex-direction: column; gap: 4px;"><p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Harga pasar untuk menilai aset Anda.</p></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; color: var(--ink-muted);"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: {{ dotC }};"></span>{{ statusText }}</span><button class="hf-btn hf-btn-ghost" type="button" onClick="{{ refresh }}">{{ refreshLabel }}</button></div>
<sc-if value="{{ stale }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 12px; background: var(--gold-soft);"><span style="color: var(--gold); display: grid; padding-top: 1px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span><span style="font-size: 13px; line-height: 20px;">Gagal memperbarui sejak 14.10. Nilai aset memakai harga terakhir.</span></div></sc-if>

<button type="button" role="switch" aria-checked="{{ ownStr }}" onClick="{{ toggleOwn }}" style="font: inherit; color: var(--ink); text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 12px; align-items: center; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer;"><span style="font-size: 14px; line-height: 20px;">Hanya yang saya miliki</span><span style="width: 44px; height: 26px; border-radius: 999px; background: {{ swBg }}; position: relative; display: block;"><span style="position: absolute; top: 3px; left: {{ swLeft }}; width: 20px; height: 20px; border-radius: 999px; background: var(--surface-raised); box-shadow: 0 1px 2px rgba(0,0,0,0.25);"></span></span></button>
<sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}"><section class="hf-card" style="padding: 4px 16px; gap: 0;" aria-label="Daftar harga">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8"><div style="display: grid; grid-template-columns: minmax(0, 1fr) 44px 136px; gap: 8px; align-items: center; min-height: 60px; padding: 8px 0;" class="pr">
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;"><span style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="font-size: 15px; font-weight: 600; white-space: nowrap; line-height: 22px;">{{ r.n }}</span><sc-if value="{{ r.own }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Dimiliki" title="Dimiliki" style="flex: none; width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand);"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if></span><span class="caption" style="color: var(--ink-muted); white-space: nowrap;">{{ r.s }}</span></span>
<svg viewBox="0 0 52 20" width="44" height="20" aria-hidden="true" style="justify-self: center;"><polyline points="{{ r.pts }}" fill="none" stroke="{{ r.col }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right;"><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 22px;">{{ r.p }}</span><span class="{{ r.cls }}">{{ r.ch }}</span></span></div></sc-for>
</section></sc-if>
<sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px 0; text-align: center; font-size: 14px; color: var(--ink-muted); line-height: 20px;">Belum ada aset di kelompok ini.</p></sc-if>
<p class="caption" style="margin: 0; color: var(--ink-muted);">Harga indikatif; perubahan dalam 24 jam. Aset manual tidak tampil.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"mulai":{"editor":"enum","options":["default","crypto","dimiliki","offline"],"default":"default"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mulai = this.props.mulai ?? 'default';
    const grp = st.grp || (mulai === 'crypto' ? 'Crypto' : 'Semua');
    const own = st.own === undefined ? mulai === 'dimiliki' : !!st.own;
    const stale = st.stale === undefined ? mulai === 'offline' : !!st.stale;
    // nama, keterangan, harga, perubahan 24 jam (%), kelompok, dimiliki, sparkline
    const D = [
      ['Bitcoin', 'BTC', 'Rp 1.482.300.000', 1.8, 'Crypto', true, [9, 8, 10, 7, 8, 5, 6, 3]],
      ['Ethereum', 'ETH', 'Rp 52.140.000', -0.6, 'Crypto', false, [4, 5, 4, 6, 5, 7, 8, 9]],
      ['PAX Gold', 'PAXG · per oz', 'Rp 74.350.000', 0.4, 'Emas & perak', true, [8, 8, 7, 8, 7, 6, 6, 5]],
      ['Tether', 'USDT', 'Rp 16.420', 0, 'Crypto', true, [6, 6, 6, 6, 6, 6, 6, 6]],
      ['Emas', 'per gram', 'Rp 2.380.000', 0.3, 'Emas & perak', true, [9, 9, 8, 8, 7, 7, 6, 6]],
      ['Perak', 'per gram', 'Rp 46.600', -0.2, 'Emas & perak', true, [5, 6, 6, 5, 7, 7, 8, 8]],
      ['BBRI', 'Bank BRI', 'Rp 4.120', 1.2, 'Saham', false, [9, 8, 9, 7, 6, 6, 4, 3]],
      ['GFI', 'per lot', 'Rp 70.000', -1.1, 'Saham', true, [3, 4, 4, 5, 6, 7, 7, 9]],
      ['USD', 'Dolar AS', 'Rp 16.420', 0.1, 'Kurs', true, [7, 7, 6, 7, 6, 6, 5, 5]]
    ];
    const rows = D.filter(d => (grp === 'Semua' || d[4] === grp) && (!own || d[5])).map(d => {
      const up = d[3] > 0, dn = d[3] < 0, col = stale ? 'var(--ink-muted)' : (dn ? 'var(--loss)' : (up ? 'var(--gain)' : 'var(--ink-muted)'));
      return { own: d[5], n: d[0], s: d[1], p: d[2], col, cls: 'hf-delta ' + (dn ? 'hf-delta-down' : (up ? 'hf-delta-up' : 'hf-delta-flat')), ch: (up ? '+' : dn ? '−' : '') + Math.abs(d[3]).toFixed(1).replace('.', ',') + '%', pts: d[6].map((v, i) => (i * 52 / 7).toFixed(1) + ',' + (v * 2 + 1)).join(' ') };
    });
    return {
      theme: this.props.theme ?? 'light',
      stale, rows, hasRows: rows.length > 0, noRows: rows.length === 0,
      dotC: stale ? 'var(--loss)' : 'var(--brand)',
      statusText: stale ? 'Terakhir diperbarui 14.10' : 'Live · diperbarui 14.32.08',
      refreshLabel: stale ? 'Coba lagi' : 'Segarkan',
      refresh: () => this.setState({ stale: false }),
      chips: ['Semua', 'Crypto', 'Emas & perak', 'Saham', 'Kurs'].map(l => ({ l, pressed: String(grp === l), on: () => this.setState({ grp: l }) })),
      ownStr: String(own), swBg: own ? 'var(--brand)' : 'var(--line-strong)', swLeft: own ? '21px' : '3px', toggleOwn: () => this.setState({ own: !own })
    };
  }
}
</script>
</body>
</html>
